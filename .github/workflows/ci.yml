name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  benchmark:
    name: planner scale baseline (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install checksum-locked MoonBit toolchain
        run: python3 scripts/install-toolchain.py --destination "$RUNNER_TEMP/weft-toolchain"
      - run: moon update
      - name: Resolve and verify inputs
        run: |
          moon check src/api src/cli --target js
          python3 scripts/check-release-inputs.py
      - name: Measure six graph cases across three backends
        run: node scripts/benchmark-planner.mjs 3
      - name: Compare binding coverage against scan reference
        run: |
          set -o pipefail
          for target in native wasm-gc js; do
            moon bench src/plan --target "$target" --debug | tee "_build/benchmarks/binding-bench-$target.txt"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: planner-scale-baseline
          path: |
            _build/benchmarks/latest.json
            _build/benchmarks/binding-bench-*.txt
          if-no-files-found: error

  portable:
    # The planner must behave identically on every backend. This is the
    # project's core claim: run the same tests three times, then compare the
    # plan each backend produces.
    name: portable (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [native, wasm-gc, js]
    steps:
      - uses: actions/checkout@v4
      - name: Install checksum-locked MoonBit toolchain
        run: python3 scripts/install-toolchain.py --destination "$RUNNER_TEMP/weft-toolchain"
      - name: Record toolchain version
        run: moon version --all
      - name: Resolve dependencies
        run: moon update
      - name: Verify resolved release inputs
        run: |
          moon check src/api src/cli --target js
          python3 scripts/check-release-inputs.py
      - name: Test portable packages
        # runtime_native is excluded on purpose: it is the only package that
        # needs wasmoon, and its types are checked separately below.
        run: |
          moon test src/graph src/manifest src/ir src/plan src/wac_adapter src/exec_plan src/api src/cli \
            --target ${{ matrix.target }}

  identical:
    # Byte-for-byte comparison of the three backends' plans. Runs the same
    # script developers run locally, so CI and a laptop check the same thing.
    name: plans are byte-identical
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install checksum-locked MoonBit toolchain
        run: python3 scripts/install-toolchain.py --destination "$RUNNER_TEMP/weft-toolchain"
      - name: Record toolchain version
        run: moon version --all
      - run: moon update
      - name: Verify resolved release inputs
        run: |
          moon check src/api src/cli --target js
          python3 scripts/check-release-inputs.py
      - name: Validate versioned schemas and golden artifacts
        run: |
          python3 -m venv "$RUNNER_TEMP/weft-schema-env"
          "$RUNNER_TEMP/weft-schema-env/bin/python" -m pip install -r scripts/schema-requirements.txt
          "$RUNNER_TEMP/weft-schema-env/bin/python" scripts/check-schemas.py
      - name: Verify gate failure propagation
        run: node scripts/test-gate.mjs
      - name: Check all three backends
        run: bash scripts/check-backends.sh

  runtime-native:
    # The execution adapter depends on wasmoon, whose C runtime needs a
    # C11-capable toolchain. Linux is the documented platform; Windows/MSVC
    # cannot build it (see docs/S3-EXECUTION.md).
    name: experimental native wiring probe (linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install checksum-locked MoonBit toolchain
        run: python3 scripts/install-toolchain.py --destination "$RUNNER_TEMP/weft-toolchain"
      - name: Record toolchain version
        run: moon version --all
      - run: moon update
      - name: Verify resolved release inputs
        run: |
          moon check src/api src/cli --target js
          python3 scripts/check-release-inputs.py
      - name: Type-check the adapter
        run: moon check src/runtime_native --target native
      - name: Verify real cross-instance native wiring probe
        run: moon test src/runtime_probe src/runtime_native --target native
      - name: Build and exercise experimental native command
        run: |
          moon build src/runtime_native --target native
          python3 scripts/test-native-cli.py

  browser:
    name: local browser demo (Chromium)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install checksum-locked MoonBit toolchain
        run: python3 scripts/install-toolchain.py --destination "$RUNNER_TEMP/weft-toolchain"
      - run: moon update
      - name: Verify resolved release inputs
        run: |
          moon check src/api src/cli --target js
          python3 scripts/check-release-inputs.py
      - name: Build local browser artifact
        run: node scripts/build-demo.mjs
      - name: Check bridge parity and five examples
        run: node scripts/test-demo.mjs
      - name: Install browser test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/weft-browser-env"
          "$RUNNER_TEMP/weft-browser-env/bin/python" -m pip install -r scripts/browser-requirements.txt
          "$RUNNER_TEMP/weft-browser-env/bin/python" -m playwright install --with-deps chromium
      - name: Check actual browser and downloaded plan bytes
        run: '"$RUNNER_TEMP/weft-browser-env/bin/python" scripts/test-browser.py'

  release-verification:
    name: release bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install locked toolchain in isolated directory
        shell: bash
        run: python scripts/install-toolchain.py --destination "$RUNNER_TEMP/weft-toolchain"
      - name: Resolve and check dependencies
        shell: bash
        run: |
          moon update
          moon check src/api src/cli --target js
          python scripts/check-release-inputs.py
      - name: Build CLI bundle and checksums
        shell: bash
        run: python scripts/build-release.py
      - name: Verify first use in a clean directory
        shell: bash
        run: |
          for archive in _build/release/weft-*.zip; do
            python scripts/test-release.py "$archive"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: weft-cli-${{ matrix.os }}
          path: |
            _build/release/weft-*.zip
            _build/release/weft-*.zip.sha256
          if-no-files-found: error
