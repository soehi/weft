name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  portable:
    # The planner must behave identically on every backend. This is the
    # project's core claim: run the same tests three times, then compare the
    # plan each backend produces.
    name: portable (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [native, wasm-gc, js]
    steps:
      - uses: actions/checkout@v4
      # setup-moonbit has no release tags; pin the verified action revision.
      - uses: moonbit-community/setup-moonbit@04293a8a813bfd4b6c2fce22701b52ae1050d100
        with:
          version: latest
      - name: Record toolchain version
        run: moon version --all
      - name: Resolve dependencies
        run: moon update
      - name: Test portable packages
        # runtime_native is excluded on purpose: it is the only package that
        # needs wasmoon, and its types are checked separately below.
        run: |
          moon test src/manifest src/ir src/plan src/wac_adapter src/exec_plan src/cli \
            --target ${{ matrix.target }}

  identical:
    # Byte-for-byte comparison of the three backends' plans. Runs the same
    # script developers run locally, so CI and a laptop check the same thing.
    name: plans are byte-identical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # setup-moonbit has no release tags; pin the verified action revision.
      - uses: moonbit-community/setup-moonbit@04293a8a813bfd4b6c2fce22701b52ae1050d100
        with:
          version: latest
      - name: Record toolchain version
        run: moon version --all
      - run: moon update
      - name: Verify gate failure propagation
        run: node scripts/test-gate.mjs
      - name: Check all three backends
        run: bash scripts/check-backends.sh

  runtime-native:
    # The execution adapter depends on wasmoon, whose C runtime needs a
    # C11-capable toolchain. Linux is the documented platform; Windows/MSVC
    # cannot build it (see docs/S3-EXECUTION.md).
    name: experimental adapter type check (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # setup-moonbit has no release tags; pin the verified action revision.
      - uses: moonbit-community/setup-moonbit@04293a8a813bfd4b6c2fce22701b52ae1050d100
        with:
          version: latest
      - name: Record toolchain version
        run: moon version --all
      - run: moon update
      - name: Type-check the adapter
        run: moon check src/runtime_native --target native
